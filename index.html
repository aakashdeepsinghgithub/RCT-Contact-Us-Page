<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Customization Solutions - Contact Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #0d1b2a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            background: #1b263b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #415a77;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #0d1b2a;
            color: white;
            margin-top: 40px;
        }

        .success-message {
            display: none;
            color: green;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Van Customization Solutions</h1>
    <p>Transform Your Van into a Dream Machine</p>
</header>

<div class="container">
    <h2>Contact Us</h2>

    <form action="http://www3.lenoxsoft.com/l/1183451/2026-04-28/7zthmk" method="POST" id="contactForm" >
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone">

        <label for="message">Your Requirement</label>
        <textarea id="message" name="message" placeholder="Tell us how you want your van customized..." required></textarea>

        <button type="submit">Submit</button>
    </form>

    <p class="success-message" id="successMessage">
        Thank you! We will contact you soon.
    </p>
</div>

<footer>
    <p>© 2026 Van Customization Solutions</p>
</footer>

<script>
    const form = document.getElementById("contactForm");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        // You can replace this with API call / backend later
        successMessage.style.display = "block";
        form.reset();
    });
</script>

</html>
