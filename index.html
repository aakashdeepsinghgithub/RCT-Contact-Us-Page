<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Customization Solutions - Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }
        header {
            background: #0d1b2a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea {
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            margin-top: 20px;
            padding: 12px;
            background: #1b263b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #415a77;
        }
        button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        footer {
            text-align: center;
            padding: 15px;
            background: #0d1b2a;
            color: white;
            margin-top: 40px;
        }

        /* Success message */
        #success-message {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        #success-message .checkmark {
            font-size: 60px;
            margin-bottom: 15px;
        }
        #success-message h3 {
            color: #1b263b;
            font-size: 24px;
            margin-bottom: 10px;
        }
        #success-message p {
            color: #555;
            font-size: 15px;
        }
        #success-message .reset-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            background: #1b263b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        #success-message .reset-btn:hover {
            background: #415a77;
        }

        /* Error message */
        #error-message {
            display: none;
            background: #fff0f0;
            border: 1px solid #ffcccc;
            color: #cc0000;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>Van Customization Solutions</h1>
    <p>Transform Your Van into a Dream Machine</p>
</header>

<div class="container">
    <h2>Contact Us</h2>

    <!-- FORM -->
    <div id="form-wrapper">
        <form id="contact-form">
            <label>Full Name</label>
            <input type="text" name="name" id="name" required>

            <label>Email Address</label>
            <input type="email" name="email" id="email" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" id="phone">

            <label>Your Requirement</label>
            <textarea name="message" id="message" required></textarea>

            <div id="error-message">Something went wrong. Please try again.</div>

            <button type="submit" id="submit-btn">Submit</button>
        </form>
    </div>

    <!-- SUCCESS MESSAGE (hidden initially) -->
    <div id="success-message">
        <div class="checkmark">✅</div>
        <h3>Thank You!</h3>
        <p>Your message has been received. Our team will get back to you shortly.</p>
        <button class="reset-btn" onclick="resetForm()">Submit Another Response</button>
    </div>
</div>

<footer>
    <p>© 2026 Van Customization Solutions</p>
</footer>

<!-- Pardot Tracking Code -->
<script type='text/javascript'>
piAId = '1184451';
piCId = '';
piHostname = 'go.demo.pardot.com';
(function() {
    function async_load(){
        var s = document.createElement('script'); s.type = 'text/javascript';
        s.src = ('https:' == document.location.protocol ? 'https://' : 'http://') + piHostname + '/pd.js';
        var c = document.getElementsByTagName('script')[0]; c.parentNode.insertBefore(s, c);
    }
    if(window.attachEvent) { window.attachEvent('onload', async_load); }
    else { window.addEventListener('load', async_load, false); }
})();
</script>

<script>
    const PARDOT_HANDLER_URL = 'https://go.demo.pardot.com/l/1183451/2026-04-28/7zthmk';

    document.getElementById('contact-form').addEventListener('submit', async function(e) {
        e.preventDefault(); // Stop page from navigating away

        const btn = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error-message');

        btn.disabled = true;
        btn.textContent = 'Submitting...';
        errorBox.style.display = 'none';

        // Build form data
        const formData = new FormData();
        formData.append('name',    document.getElementById('name').value);
        formData.append('email',   document.getElementById('email').value);
        formData.append('phone',   document.getElementById('phone').value);
        formData.append('message', document.getElementById('message').value);

        try {
            // Pardot doesn't support CORS, so we use no-cors mode.
            // The request still reaches Pardot and creates/updates the prospect —
            // we just can't read the response. We treat any sent request as success.
            await fetch(PARDOT_HANDLER_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            });

            // Show success message
            document.getElementById('form-wrapper').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';

        } catch (err) {
            // Network failure (e.g. offline)
            errorBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Submit';
        }
    });

    function resetForm() {
        document.getElementById('contact-form').reset();
        document.getElementById('success-message').style.display = 'none';
        document.getElementById('form-wrapper').style.display = 'block';
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('submit-btn').textContent = 'Submit';
    }
</script>

</body>
</html>
